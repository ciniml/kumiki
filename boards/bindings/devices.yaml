# Off-chip device bindings. `kumiki.bus` is the parent controller kind,
# `kumiki.class` the kumiki-class trait the device provides, `kumiki.init` the
# bring-up expression (see soc-espressif.yaml for the placeholders),
# `kumiki.probe` a presence test for `status = "fail-needs-probe"` candidates,
# `kumiki.gpio-pin` an `OutputPin` expression for one expander line (${line}).

# ---- power / IO expanders ----------------------------------------------------
- compatible: "x-powers,axp2101"
  kumiki:
    bus: i2c
    class: power
    init: |
      {
          chips::axp2101_init(&mut RefCellDevice::new(${bus}), ${const:ADDR}, ${regulators}).map_err(InitError::I2c)?;
          delay.delay_millis(10);
          AnyPower::${variant}(chips::Axp2101Power(RefCellDevice::new(${bus})))
      }
    variant: Axp2101
    type: "chips::Axp2101Power<SharedI2c>"
  properties:
    reg: { type: int, required: true }

- compatible: "m5stack,m5pm1"
  kumiki: { bus: i2c, class: power, init: "()" }
  properties:
    reg: { type: int, required: true }

- compatible: "awinic,aw9523b"
  kumiki:
    bus: i2c
    class: gpio-expander
    init: |
      chips::aw9523_init(&mut RefCellDevice::new(${bus}), ${const:ADDR}, ${const:P0_PUSH_PULL}, ${lines}).map_err(InitError::I2c)?
    gpio-pin: "chips::Aw9523Pin { i2c: RefCellDevice::new(${bus}), addr: ${const:ADDR}, line: ${line} }"
  properties:
    reg: { type: int, required: true }
    gpio-controller: { type: boolean, required: true }
    "#gpio-cells": { type: int, required: true }
    kumiki,p0-push-pull: { type: boolean, description: "port 0 push-pull (GCR bit 4)" }

- compatible: "m5stack,m5ioe1"
  kumiki: { bus: i2c, class: gpio-expander, init: "()" }
  properties:
    reg: { type: int, required: true }
    gpio-controller: { type: boolean, required: true }
    "#gpio-cells": { type: int, required: true }

- compatible: "diodes,pi4ioe5v6408"
  # Lines are set by board glue (Tab5: m5stack,tab5-display-power-sequence).
  kumiki: { bus: i2c, class: gpio-expander, init: "()" }
  properties:
    reg: { type: int, required: true }
    gpio-controller: { type: boolean, required: true }
    "#gpio-cells": { type: int, required: true }

# ---- displays ------------------------------------------------------------------
- compatible: "ilitek,ili9881c"
  kumiki:
    bus: dsi
    class: display
    init-for:
      # Two frame buffers at the top of PSRAM; double-buffered FbDisplay.
      p4v1: |
        {
            let fbs = bind::dsi_frame_buffers(psram).ok_or(InitError::Config)?;
            let dsi = Dsi::init(kumiki_p4v1_hal::dsi::Panel::Ili9881c, fbs[0]).map_err(|_| InitError::Display)?;
            AnyDisplay::${variant}(FbDisplay::new(DsiPanel::new(dsi, fbs)).with_rotation(bind::rotation(${const:ROTATION})))
        }
    variant: Ili9881c
    type: "kumiki_gfx::FbDisplay<kumiki_p4v1_hal::fb::DsiPanel>"
  properties:
    reg: { type: int, required: true }
    backlight: { type: phandle }
    width: { type: int, required: true }
    height: { type: int, required: true }
    rotation: { type: int, description: "clockwise degrees (0/90/180/270) from the panel's native orientation to the board's natural one (Linux panel binding)" }
    kumiki,frame-buffer: { type: string, description: "where the scan-out frame buffers live (psram)" }

- compatible: "ilitek,ili9342c"
  kumiki:
    bus: spi
    class: display
    init: &spi-dcs-init |
      {
          ${reset}
          let spi = Spi::new(${instance:parent}, SpiConfig::default().with_frequency(Rate::from_hz(${const:SPI_MAX_FREQUENCY})).with_mode(Mode::_0))
              .map_err(|_| InitError::Config)?
              .with_sck(${pin:parent.sck-gpios})
              .with_mosi(${pin:parent.mosi-gpios})
              .with_dma(p.DMA_CH0);
          let dc = Output::new(${pin:dc-gpios}, Level::High, OutputConfig::default());
          let cs = Output::new(${pin:parent.cs-gpios}, Level::High, OutputConfig::default());
          let bus = EspSpiDmaBus::new(spi, dc, Some(cs), buf_a, buf_b).with_fifo(${spihost});
          let mut panel = DcsPanel::new(bus, ${model}, ${dcs_config}, None::<NoPin>);
          panel.init(&mut delay).map_err(|_| InitError::Display)?;
          let mut d = Display::new(panel);
          DrawTarget::clear(&mut d, Rgb565::BLACK).map_err(|_| InitError::Display)?;
          AnyDisplay::${variant}(d)
      }
    model: "kumiki_gfx_panels::Ili9342c"
    variant: Ili9342c
    type: Ili9342cDisplay
  properties: &dcs-panel
    reg: { type: int, required: true }
    spi-max-frequency: { type: int, required: true }
    dc-gpios: { type: gpios }
    reset-gpios: { type: gpios }
    power-supply: { type: phandle }
    backlight: { type: phandle }
    width: { type: int, required: true }
    height: { type: int, required: true }
    kumiki,offset: { type: array, description: "x y offset inside controller memory" }
    kumiki,invert: { type: boolean }
    kumiki,rgb-order: { type: string, description: "rgb or bgr (default bgr)" }
    kumiki,round-diameter: { type: int, description: "visible circle diameter of a round panel" }
    kumiki,frame-buffer: { type: string, description: "draw through a RAM frame buffer (psram|internal)" }

- compatible: "galaxycore,gc9107"
  kumiki:
    bus: spi
    class: display
    init: *spi-dcs-init
    model: "kumiki_gfx_panels::Gc9107"
    variant: Gc9107
    type: Gc9107Display
  properties: *dcs-panel

- compatible: "chipone,co5300"
  kumiki:
    bus: spi
    class: display
    # QSPI AMOLED; x / width must be even → drawn through a PSRAM frame buffer.
    init: |
      {
          let (w, h) = (${const:WIDTH}, ${const:HEIGHT});
          let fb = bind::psram_frame_buffer(p.PSRAM, w as usize * h as usize * 2).ok_or(InitError::Config)?;
          let spi = Spi::new(${instance:parent}, SpiConfig::default().with_frequency(Rate::from_hz(${const:SPI_MAX_FREQUENCY})).with_mode(Mode::_0))
              .map_err(|_| InitError::Config)?
              .with_sck(${pin:parent.sck-gpios})
              .with_cs(${pin:parent.cs-gpios})
              .with_sio0(${pin:parent.sio-gpios[0]})
              .with_sio1(${pin:parent.sio-gpios[1]})
              .with_sio2(${pin:parent.sio-gpios[2]})
              .with_sio3(${pin:parent.sio-gpios[3]})
              .with_dma(p.DMA_CH0);
          let bus = EspQspiDmaBus::new(spi, buf_a, buf_b);
          let mut panel = DcsPanel::new(bus, ${model}, ${dcs_config}, None::<NoPin>);
          panel.init(&mut delay).map_err(|_| InitError::Display)?;
          let mut d = kumiki_gfx::BufferedDisplay::new(Display::new(panel), Size::new(w, h), fb, <${model} as Model>::X_ALIGN)
              .ok_or(InitError::Config)?;
          DrawTarget::clear(&mut d, Rgb565::BLACK).ok();
          d.flush().map_err(|_| InitError::Display)?;
          AnyDisplay::${variant}(d)
      }
    model: "kumiki_gfx_panels::Co5300"
    variant: Co5300
    type: Co5300Display
  properties: *dcs-panel

# ---- touch -------------------------------------------------------------------------
- compatible: "focaltech,ft6336u"
  kumiki:
    bus: i2c
    class: touch
    init: "AnyTouch::${variant}(chips::Ft6336 { i2c: RefCellDevice::new(${bus}) })"
    variant: Ft6336
    type: "chips::Ft6336<SharedI2c>"
  properties: &touch
    reg: { type: int, required: true }
    touchscreen-min-x: { type: sint }
    touchscreen-min-y: { type: sint }
    touchscreen-size-x: { type: int }
    touchscreen-size-y: { type: int }

- compatible: "hynitron,cst820"
  kumiki:
    bus: i2c
    class: touch
    probe: "embedded_hal::i2c::I2c::write(&mut RefCellDevice::new(${bus}), ${const:ADDR}, &[0x00]).is_ok()"
    init: "AnyTouch::${variant}(chips::Cst820 { i2c: RefCellDevice::new(${bus}), map: ${touchmap}, inited: false })"
    variant: Cst820
    type: "chips::Cst820<SharedI2c>"
  properties: *touch

- compatible: "hynitron,cst9217"
  kumiki:
    bus: i2c
    class: touch
    probe: "embedded_hal::i2c::I2c::write(&mut RefCellDevice::new(${bus}), ${const:ADDR}, &[0xD0, 0x00]).is_ok()"
    init: "AnyTouch::${variant}(chips::Cst9217 { i2c: RefCellDevice::new(${bus}) })"
    variant: Cst9217
    type: "chips::Cst9217<SharedI2c>"
  properties: *touch

- compatible: "goodix,gt911"
  kumiki:
    bus: i2c
    class: touch
    probe: "embedded_hal::i2c::I2c::write(&mut RefCellDevice::new(${bus}), ${const:ADDR}, &[]).is_ok()"
    init: "AnyTouch::${variant}(chips::Gt911 { i2c: RefCellDevice::new(${bus}), addr: ${const:ADDR} })"
    variant: Gt911
    type: "chips::Gt911<SharedI2c>"
  properties: *touch

# ---- sensors -----------------------------------------------------------------------
- compatible: "bosch,bmi270"
  kumiki:
    bus: i2c
    class: imu
    init: |
      {
          let mut m = kumiki_bmi270::Bmi270::new(RefCellDevice::new(${bus}), ${const:ADDR});
          m.init(&mut delay).ok().map(|_| AnyImu::${variant}(m))
      }
    variant: Bmi270
    type: "kumiki_bmi270::Bmi270<SharedI2c>"
  properties:
    reg: { type: int, required: true }

- compatible: "tdk,mpu6886"
  kumiki:
    bus: i2c
    class: imu
    init: |
      {
          let mut m = Mpu6886::new(RefCellDevice::new(${bus}), ${const:ADDR});
          m.init(&mut delay).ok().map(|_| AnyImu::${variant}(m))
      }
    variant: Mpu6886
    type: "kumiki_mpu6886::Mpu6886<SharedI2c>"
  properties:
    reg: { type: int, required: true }

# ---- audio -------------------------------------------------------------------------
- compatible: "awinic,aw88298"
  kumiki:
    bus: i2c
    class: speaker
    # 16-bit stereo Philips I2S on the `i2s` controller, DMA channel 1
    # (channel 0 belongs to the display bus).
    init: |
      {
          let rate = ${const:SAMPLE_RATE}.unwrap_or(48_000);
          let cfg = TdmConfig::new_tdm_philips()
              .with_sample_rate(Rate::from_hz(rate))
              .with_data_format(DataFormat::Data16Channel16)
              .with_channels(Channels::STEREO);
          let i2s = I2s::new(${instance:@i2s.}, p.DMA_CH1, cfg).map_err(|_| InitError::Config)?;
          let tx = i2s.i2s_tx.with_bclk(${pin:@i2s.bclk-gpios}).with_ws(${pin:@i2s.ws-gpios}).with_dout(${pin:@i2s.dout-gpios}).build();
          let buf = esp_hal::dma_tx_stream_buffer!(16_000, 4_000);
          let out = audio::I2sOut::new(tx, buf, rate).ok_or(InitError::Config)?;
          audio::Aw88298::new(RefCellDevice::new(${bus}), ${const:ADDR}, out).ok().map(AnySpeaker::${variant})
      }
    variant: Aw88298
    type: "audio::Aw88298<SharedI2c>"
  properties:
    reg: { type: int, required: true }
    i2s: { type: phandle, required: true }
    kumiki,sample-rate: { type: int, description: "output sample rate in Hz (default 48000)" }

# ---- real-time clocks --------------------------------------------------------------
- compatible: "belling,bm8563"
  kumiki:
    bus: i2c
    class: rtc
    init: &pcf8563-init |
      {
          let mut r = kumiki_rtc::Pcf8563::new(RefCellDevice::new(${bus}), ${const:ADDR});
          r.init().ok().map(|_| AnyRtc::${variant}(r))
      }
    variant: Pcf8563
    type: "kumiki_rtc::Pcf8563<SharedI2c>"
  properties: &rtc
    reg: { type: int, required: true }

- compatible: "nxp,pcf8563"
  kumiki: { bus: i2c, class: rtc, init: *pcf8563-init, variant: Pcf8563, type: "kumiki_rtc::Pcf8563<SharedI2c>" }
  properties: *rtc

- compatible: "epson,rx8130"
  kumiki:
    bus: i2c
    class: rtc
    init: |
      {
          let mut r = kumiki_rtc::Rx8130::new(RefCellDevice::new(${bus}), ${const:ADDR});
          r.init().ok().map(|_| AnyRtc::${variant}(r))
      }
    variant: Rx8130
    type: "kumiki_rtc::Rx8130<SharedI2c>"
  properties: *rtc
