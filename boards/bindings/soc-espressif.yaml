# Espressif SoC controller bindings (chip layer).
# Property types: int (u32), sint (i32), boolean, string, string-array,
# array (u32 list), uint8-array, phandle, phandle-array, gpios.
#
# `kumiki.init` is a Rust expression emitted by kumiki-dtgen (esp32s3
# backend) with placeholders: ${pin:P} ${pinref:P} ${const:P} ${instance}
# ${bus} ${busof:P} ${reset} ${lines} ${regulators} ${dcs_config}
# ${touchmap} ${keypin:K} ${optkeypin:K} ${spihost}; a `parent.` or `@PROP.`
# prefix on the argument selects the parent node or a phandle target.

- compatible: "simple-bus"
  properties:
    ranges: { type: boolean }

- compatible: "espressif,esp32-gpio"
  properties:
    gpio-controller: { type: boolean, required: true }
    "#gpio-cells": { type: int, required: true }
    ngpios: { type: int, required: true }
    reg: { type: array }
    kumiki,octal-psram-pins: { type: array, description: "GPIOs owned by embedded octal PSRAM" }

- compatible: "espressif,esp32-i2c"
  kumiki:
    controller: i2c
    # A shared (single-core) bus: devices get `RefCellDevice::new(${bus})`.
    init: |
      {
          if ${const:BUS_RECOVERY} {
              probe::i2c_bus_recover(${pinref:scl-gpios}, ${pinref:sda-gpios});
          }
          static CELL: StaticCell<RefCell<I2cBus>> = StaticCell::new();
          let i2c = I2c::new(${instance}, I2cConfig::default().with_frequency(bind::hz(${const:CLOCK_FREQUENCY}, 100_000)))
              .map_err(|_| InitError::Config)?
              .with_sda(${pin:sda-gpios})
              .with_scl(${pin:scl-gpios});
          &*CELL.init(RefCell::new(i2c))
      }
  properties:
    reg: { type: array }
    kumiki,instance: { type: string, required: true }
    clock-frequency: { type: int }
    sda-gpios: { type: gpios }
    scl-gpios: { type: gpios }
    kumiki,bus-recovery: { type: boolean, description: "clock SCL to free a stuck target before use" }

- compatible: "espressif,esp32-i2s"
  kumiki:
    controller: i2s
    # Full duplex, 16-bit stereo Philips I2S, master: TX drives MCLK / BCK / WS,
    # RX shares them (signal loopback). DMA channel 1 (channel 0 belongs to the
    # display bus). The devices on it take `tx` / `rx` (`${var:i2s}`).
    init: |
      {
          let rate = ${const:SAMPLE_RATE}.unwrap_or(48_000);
          let cfg = TdmConfig::new_tdm_philips()
              .with_sample_rate(Rate::from_hz(rate))
              .with_data_format(DataFormat::Data16Channel16)
              .with_channels(Channels::STEREO)
              .with_signal_loopback(true);
          let i2s = I2s::new(${instance}, p.DMA_CH1, cfg).map_err(|_| InitError::Config)?.with_mclk(${pin:mclk-gpios});
          let tx = i2s.i2s_tx.with_bclk(${pin:bclk-gpios}).with_ws(${pin:ws-gpios}).with_dout(${pin:dout-gpios}).build();
          let rx = i2s.i2s_rx.with_din(${pin:din-gpios}).build();
          audio::I2sPorts { instance: ${const:INSTANCE}, rate, tx: Some(tx), rx: Some(rx) }
      }
  properties:
    reg: { type: array }
    kumiki,instance: { type: string, required: true }
    mclk-gpios: { type: gpios }
    bclk-gpios: { type: gpios }
    ws-gpios: { type: gpios }
    dout-gpios: { type: gpios }
    din-gpios: { type: gpios }
    kumiki,sample-rate: { type: int, description: "sample rate in Hz for both directions (default 48000)" }

# ---- ESP32-P4 rev v1 (kumiki-p4v1-hal) ----------------------------------------
- compatible: "espressif,esp32p4-gpio"
  properties:
    gpio-controller: { type: boolean, required: true }
    "#gpio-cells": { type: int, required: true }
    ngpios: { type: int, required: true }
    reg: { type: array }

- compatible: "espressif,esp32p4-i2c"
  kumiki:
    controller: i2c
    init: |
      {
          static CELL: StaticCell<RefCell<I2cBus>> = StaticCell::new();
          let i2c = I2c::new(${instance}, ${pin:sda-gpios}, ${pin:scl-gpios}, bind::hz(${const:CLOCK_FREQUENCY}, 100_000));
          &*CELL.init(RefCell::new(i2c))
      }
  properties:
    reg: { type: array }
    kumiki,instance: { type: string, required: true }
    clock-frequency: { type: int }
    sda-gpios: { type: gpios }
    scl-gpios: { type: gpios }

- compatible: "espressif,esp32p4-i2s"
  kumiki:
    controller: i2s
    # Full duplex, 16-bit stereo Philips I2S, master, MCLK = 256 fs; started here
    # (the codecs need MCLK before their registers are written) and shared by the
    # devices on it as `audio::SharedI2s` (`${var:i2s}`).
    init: |
      {
          static CELL: StaticCell<RefCell<I2s>> = StaticCell::new();
          let pins = I2sPins {
              mclk: ${pin:mclk-gpios}.degrade(),
              bclk: ${pin:bclk-gpios}.degrade(),
              ws: ${pin:ws-gpios}.degrade(),
              dout: ${pin:dout-gpios}.degrade(),
              din: ${pin:din-gpios}.degrade(),
          };
          let cfg = I2sConfig { sample_rate: ${const:SAMPLE_RATE}.unwrap_or(48_000) };
          let mut i2s = I2s::new(${instance}, pins, cfg).map_err(|_| InitError::Config)?;
          i2s.start();
          delay.delay_ms(10);
          &*CELL.init(RefCell::new(i2s))
      }
  properties:
    reg: { type: array }
    kumiki,instance: { type: string, required: true }
    mclk-gpios: { type: gpios, required: true }
    bclk-gpios: { type: gpios, required: true }
    ws-gpios: { type: gpios, required: true }
    dout-gpios: { type: gpios, required: true }
    din-gpios: { type: gpios, required: true }
    kumiki,sample-rate: { type: int, description: "sample rate in Hz (default 48000)" }

- compatible: "espressif,esp32p4-dsi"
  kumiki:
    controller: dsi
    # The panel on the link brings the host up (timing and init table are per panel).
    init: "()"
  properties:
    reg: { type: array }

- compatible: "espressif,esp32-spi"
  kumiki:
    controller: spi
    # The device on the bus builds the SPI master (its bus flavour differs).
    init: "()"
  properties:
    reg: { type: array }
    kumiki,instance: { type: string, required: true }
    sck-gpios: { type: gpios }
    mosi-gpios: { type: gpios }
    cs-gpios: { type: gpios }
    sio-gpios: { type: gpios, description: "SIO0..SIO3 for quad SPI" }
