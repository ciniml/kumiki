# Board-level bindings: backlights, buttons, glue, detection rules.

- compatible: "kumiki,regulator-backlight"
  kumiki:
    class: backlight
    # The regulator provider is an AXP2101 LDO (DLDO1 on CoreS3).
    init: |
      {
          let mut b = AnyBacklight::${variant}(chips::Axp2101Backlight(RefCellDevice::new(${busof:power-supply})));
          kumiki_class::Backlight::set_brightness(&mut b, ${const:DEFAULT_BRIGHTNESS}.unwrap_or(160).min(255) as u8)
              .map_err(|_| InitError::Display)?;
          b
      }
    variant: Axp2101
    type: "chips::Axp2101Backlight<SharedI2c>"
  properties:
    power-supply: { type: phandle, required: true }
    default-brightness: { type: int }

- compatible: "gpio-backlight"
  kumiki:
    class: backlight
    init: "AnyBacklight::${variant}(kumiki_class::GpioBacklight(Output::new(${pin:gpios}, Level::High, OutputConfig::default())))"
    init-for:
      p4v1: "AnyBacklight::${variant}(kumiki_class::GpioBacklight(Output::new(${pin:gpios}, true)))"
    variant: Gpio
    # `GpioOut`: the family's push-pull output type.
    type: "kumiki_class::GpioBacklight<GpioOut>"
  properties:
    gpios: { type: gpios, required: true }
    default-on: { type: boolean }

- compatible: "kumiki,dcs-backlight"
  kumiki: { class: backlight, init: "AnyBacklight::None", variant: "None" }
  properties:
    display: { type: phandle, required: true }

- compatible: "gpio-keys"
  kumiki:
    class: buttons
    child-props: { gpios: gpios, "kumiki,button": string }
    init: "ButtonInputs::Gpio { a: ${keypin:a}, b: ${optkeypin:b} }"
  properties: {}

- compatible: "kumiki,touch-keys"
  kumiki: { class: buttons, init: "ButtonInputs::TouchAsA" }
  properties:
    touch: { type: phandle, required: true }

# Glue for M5Stack StopWatch: the opaque M5PM1 / M5IOE1 power and reset
# sequence (port of M5GFX pmic_ops::stopwatch_power_on).
- compatible: "m5stack,stopwatch-power-sequence"
  kumiki:
    init: |
      {
          let _cs = Output::new(${pinref:@hold-cs.cs-gpios}, Level::High, OutputConfig::default());
          chips::stopwatch_power_on(&mut RefCellDevice::new(${busof:pmic}), &mut delay).map_err(InitError::I2c)?;
      }
  properties:
    pmic: { type: phandle, required: true }
    io-expander: { type: phandle, required: true }
    hold-cs: { type: phandle, description: "SPI controller whose CS is held high meanwhile" }

# Glue for M5Stack Tab5: release the LCD / touch resets through PI4IOE5V6408
# #1, identify the panel lot, synchronise the GT911's INT (address select).
# Port of tab5-os tab5.rs::init.
- compatible: "m5stack,tab5-display-power-sequence"
  kumiki:
    init-for:
      p4v1: |
        chips::tab5_display_power_on(&mut RefCellDevice::new(${busof:io-expander}), ${pin:touch-int-gpios}.degrade())?
  properties:
    io-expander: { type: phandle, required: true }
    touch-int-gpios: { type: gpios, required: true }

# Linux `regulator-fixed` switched by one line: a `kumiki_class::Rail` (use
# count in the board's `rails` module). Off after bring-up unless
# `regulator-boot-on` / `regulator-always-on`.
- compatible: "regulator-fixed"
  kumiki:
    init: |
      {
          let mut r = kumiki_class::Rail::new(&${rail}, kumiki_class::GpioSwitch::new(${outpin:gpios}, bind::active_low(${const:GPIOS}), ${const:STARTUP_DELAY_US}.unwrap_or(0), Delay::new()));
          if ${const:REGULATOR_BOOT_ON} || ${const:REGULATOR_ALWAYS_ON} {
              r.enable().map_err(|_| InitError::Config)?;
          }
          r
      }
    type: "kumiki_class::Rail<kumiki_class::GpioSwitch<${outpin-type:gpios}, Delay>>"
  properties:
    regulator-name: { type: string }
    gpios: { type: gpios, required: true }
    startup-delay-us: { type: int, description: "time the output needs to settle after switching on" }
    regulator-boot-on: { type: boolean }
    regulator-always-on: { type: boolean }

# Linux `gpio-poweroff`: driving the line active switches the board off.
# Bring-up never touches the line (kumiki-dtgen also refuses gpio-hogs on it
# and leaves it out of expander line set-up); only a power-off does (doc/13).
- compatible: "gpio-poweroff"
  kumiki: { init: "()" }
  properties:
    gpios: { type: gpios, required: true }
    active-delay-ms: { type: int, description: "time the line is held active (Linux default 100)" }
    inactive-delay-ms: { type: int, description: "time between pulses (Linux default 100)" }
    timeout-ms: { type: int }
    kumiki,pulses: { type: int, description: "number of active pulses (default 1; some boards need several)" }

- compatible: "kumiki,board-detect"
  properties: {}

- compatible: "kumiki,probe-i2c-reg"
  properties:
    device: { type: phandle, required: true }
    register: { type: int, required: true }
    expect: { type: int, required: true }

- compatible: "kumiki,probe-i2c-ack"
  properties:
    device: { type: phandle, required: true }
    register: { type: int, required: true }
    kumiki,reject: { type: array, description: "register values that mean absent (e.g. 0x00 0xff of a device still booting)" }
    kumiki,boot-time-ms: { type: int, description: "the device answers within this time after power-on: keep probing until then" }

- compatible: "kumiki,probe-dcs-id-3wire"
  properties:
    display: { type: phandle, required: true }
    expect: { type: uint8-array, required: true }
