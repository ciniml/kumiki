[package]
name = "kumiki-boards"
description = "Board definitions for kumiki (ESP32-S3: M5Stack CoreS3 / AtomS3 / StopWatch; ESP32-P4 rev v1: M5Stack Tab5), generated from the device tree, with runtime board detection"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Kenta Ida <fuga@fugafuga.org>"]
repository = "https://github.com/ciniml/kumiki"

[features]
# Exactly one chip.
chip-esp32s3 = ["dep:esp-hal", "dep:kumiki-gfx-bus-esp", "dep:kumiki-mpu6886", "kumiki-gfx-bus-esp/fifo-esp32s3"]
chip-p4v1 = ["dep:kumiki-p4v1-hal"]
# Optional board pinning (no feature = every board of the chip is a detection candidate).
board-m5stack-cores3 = []
board-m5stack-atoms3 = []
board-m5stack-stopwatch = []
board-m5stack-tab5 = []

[dependencies]
kumiki-gfx = { path = "../../gfx/kumiki-gfx" }
kumiki-gfx-panels = { path = "../../gfx/kumiki-gfx-panels" }
kumiki-class = { path = "../../dt/kumiki-class" }
kumiki-bmi270 = { path = "../../drivers/kumiki-bmi270" }
kumiki-rtc = { path = "../../drivers/kumiki-rtc" }
embedded-graphics-core = "0.4"
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
static_cell = "2"
# ESP32-S3
kumiki-gfx-bus-esp = { path = "../../gfx/kumiki-gfx-bus-esp", optional = true }
kumiki-mpu6886 = { path = "../../drivers/kumiki-mpu6886", optional = true }
esp-hal = { version = ">=1.2, <1.4", features = ["requires-unstable"], optional = true }
# ESP32-P4 rev v1
kumiki-p4v1-hal = { path = "../../hal/kumiki-p4v1-hal", features = ["gfx"], optional = true }
