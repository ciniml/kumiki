[package]
name = "kumiki-p4v1-hal"
description = "Minimal no_std HAL for ESP32-P4 chip revision v1.x (M5Stack Tab5), booted by the ESP-IDF 2nd stage bootloader"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Kenta Ida <fuga@fugafuga.org>"]
repository = "https://github.com/ciniml/kumiki"
rust-version = "1.88"

[features]
default = ["rt", "usj-console", "log"]
## The runtime for a bare-metal application: `_start`, the trap vector, the
## ESP-IDF app descriptor, `entry!`, and turning the watchdogs off before
## `main`. Leave it out when the HAL is linked into an OS kernel that has its
## own (call `time::init()` yourself then).
rt = []
## The console (`println!`, the HAL's `log!` lines) starts out on USB
## Serial/JTAG. Without it the console discards everything until
## `console::set_sink` is called.
usj-console = []
## Progress and diagnostic lines from the HAL's bring-up code on the console.
log = []
## `fb::DsiPanel`: the DSI output as a kumiki-gfx `FramebufferPanel`.
gfx = ["dep:kumiki-gfx", "dep:embedded-graphics-core"]

[dependencies]
embedded-hal = "1.0"
kumiki-gfx = { path = "../../gfx/kumiki-gfx", optional = true }
embedded-graphics-core = { version = "0.4", optional = true }
