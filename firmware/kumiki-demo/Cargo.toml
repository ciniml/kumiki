[package]
name = "kumiki-demo"
description = "One firmware image for M5Stack CoreS3 and AtomS3 (runtime board detection)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
kumiki-boards = { path = "../../boards/kumiki-boards", features = ["chip-esp32s3"] }
kumiki-class = { path = "../../dt/kumiki-class" }
kumiki-gfx = { path = "../../gfx/kumiki-gfx" }
embedded-graphics = "0.8"
esp-hal = { version = "1.2", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
