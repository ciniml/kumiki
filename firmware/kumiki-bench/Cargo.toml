[package]
name = "kumiki-bench"
description = "kumiki-gfx benchmarks (compare with M5GFX, doc/10-performance-plan.md)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["fifo"]
cores3 = []
atoms3 = []
# Small transfers through the SPI FIFO instead of DMA (disable to compare).
fifo = ["kumiki-gfx-bus-esp/fifo-esp32s3"]

[dependencies]
kumiki-gfx = { path = "../../gfx/kumiki-gfx" }
kumiki-gfx-panels = { path = "../../gfx/kumiki-gfx-panels" }
kumiki-gfx-bus-esp = { path = "../../gfx/kumiki-gfx-bus-esp" }
embedded-graphics = "0.8"
embedded-hal = "1.0"
esp-hal = { version = "1.2", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
